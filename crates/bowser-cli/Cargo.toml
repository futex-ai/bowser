[package]
name = "bowser-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line browser automation and structured page capture powered by Bowser"

[[bin]]
name = "bowser"
path = "src/main.rs"

[[test]]
name = "cli_flows"
path = "tests/cli_flows/mod.rs"

[[test]]
name = "interactive_repl"
path = "tests/interactive_repl/mod.rs"

[dependencies]
axum = "0.8.8"
bowser = { workspace = true }
clap = { version = "4.6.0", features = ["derive"] }
nix = { version = "0.31.2", features = ["signal"] }
rustyline = "18.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shlex = "1.3.0"
thiserror = "2.0.18"
tokio = { version = "1.51.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.0"
axum = "0.8.8"
base64 = "0.22.1"
expectrl = "0.8.0"
png = "0.18.1"
tempfile = "3.27.0"
