<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Wheel Fixture</title>
    <script>
      window.__bowserWheelStats = {
        count: 0,
        trustedCount: 0,
        deltas: []
      };
      window.addEventListener('DOMContentLoaded', () => {
        window.addEventListener('wheel', (event) => {
          window.__bowserWheelStats.count += 1;
          if (event.isTrusted) window.__bowserWheelStats.trustedCount += 1;
          window.__bowserWheelStats.deltas.push(event.deltaY);
        }, { passive: true });
      });
    </script>
    <style>
      body { margin: 0; min-height: 3200px; font-family: sans-serif; }
      main { padding: 32px; }
      .spacer { height: 1400px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Wheel Fixture</h1>
      <p>Scroll to record trusted wheel events.</p>
      <div class="spacer"></div>
      <p>Bottom marker</p>
    </main>
  </body>
</html>
