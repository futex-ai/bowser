<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Click Reveals Images</title>
    <script>
      function revealImages() {
        document.getElementById('status').textContent = 'clicked';
        const container = document.getElementById('images');
        for (const alt of ['one', 'two', 'three', 'four', 'five', 'six']) {
          const image = document.createElement('img');
          image.alt = alt;
          image.src = '/images/checkerboard.png';
          container.appendChild(image);
        }
      }
    </script>
  </head>
  <body>
    <button onclick="revealImages()">Accept</button>
    <p id="status">idle</p>
    <div id="images"></div>
  </body>
</html>
