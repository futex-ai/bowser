[package]
name = "bowser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Chrome control library for structured page capture and resumable browser sessions"

[[test]]
name = "browser_flows"
path = "tests/browser_flows/mod.rs"

[dependencies]
async-trait = "0.1.89"
async-tungstenite = { version = "0.34.1", features = ["tokio-runtime"] }
base64 = "0.22.1"
chromiumoxide = "0.9.1"
chrono = { version = "0.4.44", features = ["serde"] }
dirs = "6.0.0"
futures = "0.3.32"
reqwest = { version = "0.13.2", features = ["json", "rustls", "blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
thiserror = "2.0.18"
tokio = { version = "1.51.1", features = ["full"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.23.0", features = ["v4", "serde"] }
which = "8.0.2"

[dev-dependencies]
axum = "0.8.8"
png = "0.18.1"
tempfile = "3.27.0"
unimock = "0.6.8"
