name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v<workspace-version> tag to release or rebuild"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bowser-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ACTIONLINT_VERSION: v1.7.12
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_TOOLCHAIN: 1.89.0

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      release_title: ${{ steps.release.outputs.release_title }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev shellcheck xvfb
          command -v google-chrome || command -v chromium || command -v chromium-browser

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Install actionlint
        run: |
          version="${ACTIONLINT_VERSION#v}"
          asset="actionlint_${version}_linux_amd64.tar.gz"
          install_root="$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-max-time 120 --retry-all-errors "https://github.com/rhysd/actionlint/releases/download/$ACTIONLINT_VERSION/$asset" --output "$RUNNER_TEMP/$asset"
          echo "$ACTIONLINT_LINUX_AMD64_SHA256  $RUNNER_TEMP/$asset" | sha256sum --check
          mkdir -p "$install_root"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$install_root" actionlint
          echo "$install_root" >> "$GITHUB_PATH"

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
        run: scripts/release.sh validate-tag "$RELEASE_TAG" Cargo.toml >> "$GITHUB_OUTPUT"

      - name: Run repository checks
        run: cargo xtask check

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "${{ matrix.target }}"

      - name: Build release CLI
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --package bowser-cli --bin bowser --target "$TARGET"

      - name: Smoke test release CLI
        env:
          TARGET: ${{ matrix.target }}
        run: |
          "target/$TARGET/release/bowser" --help

      - name: Package release asset
        id: package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: scripts/release.sh package "$VERSION" "$TARGET" "target/$TARGET/release/bowser" dist >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset_name }}
          path: |
            ${{ steps.package.outputs.asset_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error

  publish:
    name: Publish Release
    needs:
      - verify
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ needs.verify.outputs.release_title }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/* --generate-notes --title "$RELEASE_TITLE" --verify-tag --repo "$REPO"
          fi
